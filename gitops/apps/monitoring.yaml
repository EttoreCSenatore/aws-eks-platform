# Prometheus, Alertmanager, Grafana and node/kube-state exporters.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.4.1
    helm:
      valuesObject:
        prometheus:
          prometheusSpec:
            # Pick up ServiceMonitors from every namespace, not only this release.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            retention: 7d
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
        grafana:
          # Empty = the chart generates a random password in the
          # monitoring/monitoring-grafana secret (no default credentials).
          adminPassword: ""
          service:
            type: ClusterIP
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus Operator CRDs are too large for client-side apply.
      - ServerSideApply=true
