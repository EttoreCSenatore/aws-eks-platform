name: destroy

# Manual teardown so a demo cluster never keeps billing by accident.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-dev" to delete every resource in the dev stack'
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-refs/heads/main
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1

jobs:
  destroy:
    if: inputs.confirm == 'destroy-dev'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/infra.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      # Remove ArgoCD-managed apps first so their AWS resources (load
      # balancers, volumes) are cleaned up before the VPC goes away.
      - name: destroy GitOps layer
        run: terraform destroy -var-file=envs/dev.tfvars -target=helm_release.root_app -auto-approve

      - name: destroy everything
        run: terraform destroy -var-file=envs/dev.tfvars -auto-approve
